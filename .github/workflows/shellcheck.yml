name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck -x \
            -e SC1090,SC1091,SC2034,SC2086,SC2162,SC2207,SC2126,SC2001,SC2046,SC2155,SC2181,SC2076,SC2004,SC2329 \
            hy2-manager.sh \
            install.sh \
            modules/auto-update.sh \
            modules/backup.sh \
            modules/install.sh \
            modules/port-hopping.sh \
            scripts/common.sh \
            scripts/config.sh \
            contrib/config-loader.sh
